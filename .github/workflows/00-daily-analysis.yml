name: 工商银行收盘分析
on:
  push:
    paths:
      - .github/workflows/00-daily-analysis.yml
  workflow_dispatch:
  schedule:
    - cron: '17 10 * * 1-5'

permissions:
  contents: read
  issues: write

concurrency:
  group: icbc-analysis
  cancel-in-progress: false

jobs:
  analyze:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      TZ: Asia/Shanghai
      STOCK_LIST: '601398'
      LITELLM_MODEL: icbc-local
      LITELLM_CONFIG: /tmp/icbc-model.yml
      REPORT_INTEGRITY_RETRY: '0'
      OLLAMA_API_BASE: http://127.0.0.1:11434
      LLM_TIMEOUT_SEC: '600'
      AGENT_MODE: 'false'
      REPORT_LANGUAGE: zh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: ''
      - name: 安装项目依赖
        run: python -m pip install --no-cache-dir -r requirements.txt
      - name: 检查沪市交易日
        id: calendar
        run: |
          python - <<'PY'
          import os
          from src.core.trading_calendar import get_open_markets_today
          run = os.environ['GITHUB_EVENT_NAME'] != 'schedule' or 'cn' in get_open_markets_today()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print(f"run={str(run).lower()}", file=output)
          if not run:
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                  print("沪市休市，今日跳过。", file=summary)
          PY
      - name: 启动本次任务专用的免费模型
        if: steps.calendar.outputs.run == 'true'
        run: |
          docker run -d --name ollama -p 127.0.0.1:11434:11434 -e OLLAMA_CONTEXT_LENGTH=16384 ollama/ollama
          curl --fail --silent --retry 15 --retry-all-errors --retry-delay 2 http://127.0.0.1:11434/api/version
          docker exec ollama ollama pull qwen2.5:3b
      - name: 分析并展示报告
        if: steps.calendar.outputs.run == 'true'
        run: |
          cat > "$LITELLM_CONFIG" <<'YAML'
          model_list:
            - model_name: icbc-local
              litellm_params:
                model: openai/qwen2.5:3b
                api_base: http://127.0.0.1:11434/v1
                api_key: local
                response_format:
                  type: json_object
          YAML
          python main.py --stocks "$STOCK_LIST" --force-run --no-market-review --no-notify
          report=$(find reports -type f -name 'report_*.md' -size +0c -print -quit)
          test -n "$report"
          grep -q '601398' "$report"
          cat "$report" >> "$GITHUB_STEP_SUMMARY"
      - name: 准备工行邮件短报
        if: steps.calendar.outputs.run == 'true'
        run: |
          python - <<'PY'
          import json, os, sqlite3
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          db = sqlite3.connect("file:data/stock_analysis.db?mode=ro", uri=True)
          advice, raw = db.execute("SELECT operation_advice, raw_result FROM analysis_history WHERE code=? ORDER BY id DESC LIMIT 1", ("601398",)).fetchone()
          result = json.loads(raw)
          phase = (result.get("dashboard") or {}).get("phase_decision") or {}
          action = str(result.get("action") or result.get("decision_type") or "").lower()
          if (advice in ("买入", "加仓", "强烈买入") and action in ("buy", "strong_buy", "add")):
              verdict = "出现候选买点，先核对条件"
          elif advice in ("减仓", "卖出", "止损", "强烈卖出") or action in ("sell", "reduce"):
              verdict = "风险升高，暂不考虑加仓"
          else:
              verdict = "先观察，暂无明确加仓信号"
          conditions = phase.get("watch_conditions") or []
          points = [v.strip().replace("@", "＠") for v in conditions if isinstance(v, str) and v.strip()][:2]
          now = datetime.now(ZoneInfo("Asia/Shanghai"))
          period = "收盘" if os.environ["GITHUB_EVENT_NAME"] == "schedule" else "手动测试"
          title = f"工行提醒｜{now:%m月%d日} {period}｜{verdict}"
          body = [f"@{os.environ['GITHUB_REPOSITORY_OWNER']}", f"**工商银行 601398 · {now:%Y-%m-%d %H:%M}（北京时间）**", f"模型判断：{verdict}。", "接下来留意：" + ("；".join(points) if points else "报告没有给出可核实的买入条件，等下一份收盘报告。"), "这是一次分析，不是盘中到价提醒。"]
          Path("/tmp/icbc-title").write_text(title)
          Path("/tmp/icbc-body").write_text("\n\n".join(body))
          PY
      - name: 通知仓库主人
        if: steps.calendar.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$(cat /tmp/icbc-title)" --body-file /tmp/icbc-body
