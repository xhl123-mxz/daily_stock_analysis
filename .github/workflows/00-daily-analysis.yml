name: 工商银行收盘分析
on:
  push:
    paths:
      - .github/workflows/00-daily-analysis.yml
  workflow_dispatch:
  schedule:
    - cron: '17 10 * * 1-5'

permissions:
  contents: read

concurrency:
  group: icbc-analysis
  cancel-in-progress: false

jobs:
  analyze:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      TZ: Asia/Shanghai
      STOCK_LIST: '601398'
      LITELLM_MODEL: ollama/qwen2.5:3b
      OLLAMA_API_BASE: http://127.0.0.1:11434
      LLM_TIMEOUT_SEC: '600'
      AGENT_MODE: 'false'
      REPORT_LANGUAGE: zh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: ''
      - name: 安装项目依赖
        run: python -m pip install --no-cache-dir -r requirements.txt
      - name: 检查沪市交易日
        id: calendar
        run: |
          python - <<'PY'
          import os
          from src.core.trading_calendar import get_open_markets_today
          run = os.environ['GITHUB_EVENT_NAME'] != 'schedule' or 'cn' in get_open_markets_today()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print(f"run={str(run).lower()}", file=output)
          if not run:
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                  print("沪市休市，今日跳过。", file=summary)
          PY
      - name: 启动本次任务专用的免费模型
        if: steps.calendar.outputs.run == 'true'
        run: |
          docker run -d --name ollama -p 127.0.0.1:11434:11434 -e OLLAMA_CONTEXT_LENGTH=16384 ollama/ollama
          curl --fail --silent --retry 15 --retry-connrefused --retry-delay 2 http://localhost:11434/api/version
          docker exec ollama ollama pull qwen2.5:3b
      - name: 分析并展示报告
        if: steps.calendar.outputs.run == 'true'
        run: |
          python main.py --stocks "$STOCK_LIST" --force-run --no-market-review --no-notify
          report=$(find reports -type f -name 'report_*.md' -size +0c -print -quit)
          test -n "$report"
          grep -q '601398' "$report"
          cat "$report" >> "$GITHUB_STEP_SUMMARY"

