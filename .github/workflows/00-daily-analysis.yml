name: 更新网页 AI 观察
on:
  push:
    paths:
      - .github/workflows/00-daily-analysis.yml
  workflow_dispatch:
  schedule:
    - cron: '5 1,4,10 * * 1-5'

permissions:
  contents: read

concurrency:
  group: icbc-analysis
  cancel-in-progress: false

jobs:
  analyze:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stock: ['002594', '601398', '601288', '601988', '601939', '600900', '600941', '600887', '600276', '000333', '601919', '601766', '601899', '600309']
    outputs:
      trading_day: ${{ steps.calendar.outputs.run }}
    timeout-minutes: 35
    env:
      TZ: Asia/Shanghai
      STOCK_LIST: ${{ matrix.stock }}
      LITELLM_MODEL: icbc-local
      LITELLM_CONFIG: /tmp/icbc-model.yml
      REPORT_INTEGRITY_RETRY: '0'
      OLLAMA_API_BASE: http://127.0.0.1:11434
      LLM_TIMEOUT_SEC: '600'
      AGENT_MODE: 'false'
      REPORT_LANGUAGE: zh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: ''
      - name: 安装项目依赖
        run: python -m pip install --no-cache-dir -r requirements.txt
      - name: 检查沪市交易日
        id: calendar
        run: |
          python - <<'PY'
          import os
          from src.core.trading_calendar import get_open_markets_today
          run = os.environ['GITHUB_EVENT_NAME'] != 'schedule' or 'cn' in get_open_markets_today()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print(f"run={str(run).lower()}", file=output)
          if not run:
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                  print("沪市休市，今日跳过。", file=summary)
          PY
      - name: 启动本次任务专用的免费模型
        if: steps.calendar.outputs.run == 'true'
        run: |
          docker run -d --name ollama -p 127.0.0.1:11434:11434 -e OLLAMA_CONTEXT_LENGTH=16384 ollama/ollama
          curl --fail --silent --retry 15 --retry-all-errors --retry-delay 2 http://127.0.0.1:11434/api/version
          docker exec ollama ollama pull qwen2.5:3b
      - name: 分析并展示报告
        id: report
        if: steps.calendar.outputs.run == 'true'
        run: |
          cat > "$LITELLM_CONFIG" <<'YAML'
          model_list:
            - model_name: icbc-local
              litellm_params:
                model: openai/qwen2.5:3b
                api_base: http://127.0.0.1:11434/v1
                api_key: local
                response_format:
                  type: json_object
          YAML
          python main.py --stocks "$STOCK_LIST" --force-run --no-market-review --no-notify
          report=$(find reports -type f -name 'report_*.md' -size +0c -print -quit)
          test -n "$report"
          grep -q "$STOCK_LIST" "$report"
          cat "$report" >> "$GITHUB_STEP_SUMMARY"
      - name: 提取当日观察结果
        if: ${{ !cancelled() && steps.calendar.outputs.run == 'true' }}
        run: |
          python - <<'PY'
          import json, os, sqlite3
          from pathlib import Path
          from datetime import datetime, timezone
          code = os.environ["STOCK_LIST"]
          db = sqlite3.connect("file:data/stock_analysis.db?mode=ro", uri=True)
          row = db.execute("SELECT raw_result,operation_advice,trend_prediction FROM analysis_history WHERE code=? ORDER BY id DESC LIMIT 1",(code,)).fetchone()
          if row:
              raw = json.loads(row[0])
              core = (raw.get("dashboard") or {}).get("core_conclusion") or {}
              advice = str((core.get("position_advice") or {}).get("no_position") or "")
              summary = str(core.get("one_sentence") or advice or row[2])[:280]
              caution = any(x in summary + advice for x in ("等","观望","暂","不宜","不建议","谨慎","避免","不买","不要","不入场","不建仓"))
              entry = not caution and row[1] in ("买入","强烈买入","建仓") and any(x in advice for x in ("入场","建仓","买入","介入"))
              exit_signal = row[1] in ("卖出", "减仓", "止损", "清仓") and str(raw.get("action") or raw.get("decision_type")).lower() in ("sell","reduce","strong_sell","exit")
              data = dict(exit_signal=exit_signal,time=datetime.now(timezone.utc).isoformat(),view=row[2],summary=summary,entry=entry)
              Path(code+".json").write_text(json.dumps(data,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.calendar.outputs.run == 'true' }}
        with:
          name: brief-${{ matrix.stock }}
          path: ${{ matrix.stock }}.json
          retention-days: 1
          if-no-files-found: warn

  publish:
    needs: analyze
    if: ${{ !cancelled() && github.event.repository.private == false && (needs.analyze.outputs.trading_day == 'true' || needs.analyze.result == 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: brief-*
          path: briefs
          merge-multiple: true
      - name: 发布网页模型数据
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64,json,os,subprocess
          from pathlib import Path
          files = list(Path("briefs").glob("*.json"))
          if not files:
              raise SystemExit("没有可用的新分析")
          payload = {f.stem: json.loads(f.read_text()) for f in files}
          api = "repos/"+os.environ["GITHUB_REPOSITORY"]+"/contents/web-data/ai.json"
          sha = subprocess.check_output(["gh","api",api,"--jq",".sha"],text=True).strip()
          change = dict(sha=sha,message="更新网页 AI 分析 [skip ci]",content=base64.b64encode(json.dumps(payload,ensure_ascii=False).encode()).decode())
          subprocess.run(["gh","api","-X","PUT",api,"--input","-","--silent"],input=json.dumps(change),text=True,check=True)
          PY
